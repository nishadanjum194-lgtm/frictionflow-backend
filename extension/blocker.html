<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrictionFlow - Pause & Reflect</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 2.5rem; border-radius: 1rem; text-align: center; max-width: 460px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); box-sizing: border-box; }
    h1 { color: #38bdf8; margin-top: 0; }
    p { color: #94a3b8; }
    button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #2563eb; }
    button.secondary { background: transparent; color: #ef4444; border: 1px solid #ef4444; margin-top: 1.5rem; }
    button.secondary:hover { background: #7f1d1d33; }
    input { background: #0f172a; border: 1px solid #475569; color: white; padding: 0.5rem; border-radius: 0.375rem; text-align: center; font-size: 1.1rem; width: 100%; box-sizing: border-box; }
    .timer { font-size: 2.2rem; font-weight: bold; color: #facc15; margin: 1rem 0; min-height: 2.5rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛑 Mindful Pause</h1>
    <p>You are attempting to visit <strong id="targetDomain" style="color: #38bdf8;"></strong>.</p>

    <div id="waitSection">
      <p>Take a breath. Wait before proceeding:</p>
      <div class="timer" id="timerDisplay">60s</div>
    </div>

    <div id="mathSection" class="hidden">
      <p>Solve this math problem to proceed:</p>
      <div id="mathQuestion" style="font-size: 1.25rem; font-weight: bold; margin: 0.5rem 0;"></div>
      <input type="number" id="mathAnswer" placeholder="Answer">
      <br>
      <button id="submitMath">Verify &amp; Enter</button>
    </div>

    <button id="emergencyExit" class="secondary">Abandon &amp; Close Tab</button>
  </div>
  <script src="blocker.js"></script>
</body>
</html>
