<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrictionFlow Settings</title>
  <style>
    body { width: 320px; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; padding: 1rem; margin: 0; }
    h2 { color: #38bdf8; font-size: 1.15rem; margin: 0 0 0.25rem; }
    .muted { font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.75rem; }
    .rule-item { background: #1e293b; padding: 0.6rem 0.75rem; border-radius: 0.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .rule-main { display: flex; flex-direction: column; }
    .rule-domain { font-weight: 600; }
    .rule-meta { font-size: 0.72rem; color: #94a3b8; margin-top: 0.15rem; }
    button.remove { width: auto; background: #ef4444; padding: 0.25rem 0.5rem; font-size: 0.75rem; border: none; border-radius: 0.375rem; color: white; cursor: pointer; flex-shrink: 0; }
    button.remove:hover { background: #dc2626; }
    form { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 0.15rem; }
    input[type="text"], input[type="number"] { background: #1e293b; border: 1px solid #475569; color: white; padding: 0.45rem 0.6rem; border-radius: 0.375rem; box-sizing: border-box; width: 100%; }
    .row { display: flex; gap: 0.5rem; }
    .row > div { flex: 1; }
    .checkbox { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; }
    button.add { background: #3b82f6; color: white; border: none; padding: 0.5rem; border-radius: 0.375rem; font-weight: 600; cursor: pointer; margin-top: 0.25rem; }
    button.add:hover { background: #2563eb; }
    .empty { text-align: center; color: #94a3b8; padding: 1rem 0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h2>FrictionFlow</h2>
  <p class="muted">Add mindful friction to distracting sites.</p>
  <div id="rulesList"></div>
  <form id="addForm">
    <div>
      <label for="newDomain">Website domain</label>
      <input type="text" id="newDomain" placeholder="e.g. reddit.com" required>
    </div>
    <div class="row">
      <div>
        <label for="newWait">Wait (seconds)</label>
        <input type="number" id="newWait" min="1" max="600" value="60" required>
      </div>
      <div class="checkbox" style="align-self: end; padding-bottom: 0.55rem;">
        <input type="checkbox" id="newMath" checked>
        <label for="newMath" style="margin: 0;">Math challenge</label>
      </div>
    </div>
    <button class="add" type="submit">Add Rule</button>
  </form>
  <script src="popup.js"></script>
</body>
</html>
