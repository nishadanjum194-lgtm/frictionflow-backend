<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrictionFlow Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
    h1 { margin: 0; color: #3b82f6; font-size: 1.8rem; }
    .badge { background: #22c55e; color: #0f172a; padding: .25rem .75rem; border-radius: 9999px; font-weight: bold; font-size: .85rem; }
    .card { background: #1e293b; border-radius: .75rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1); margin-bottom: 1.5rem; }
    h2 { margin-top: 0; font-size: 1.25rem; color: #e2e8f0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: .75rem; text-align: left; border-bottom: 1px solid #334155; font-size: .95rem; }
    th { color: #94a3b8; font-weight: 600; }
    td { color: #cbd5e1; overflow-wrap: anywhere; }
    .refresh-btn { background: #3b82f6; color: white; border: none; padding: .5rem 1rem; border-radius: .375rem; cursor: pointer; font-weight: 600; }
    input { background: #0f172a; color: white; border: 1px solid #475569; border-radius: .375rem; padding: .5rem .7rem; min-width: 260px; }
    .muted { color: #94a3b8; font-size: .85rem; }
    .error { color: #fca5a5; }
    @media(max-width:700px){body{padding:1rem}.container{overflow-x:auto}header{gap:1rem;flex-wrap:wrap}table{min-width:650px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FrictionFlow Analytics</h1>
      <span class="badge">Dashboard</span>
    </header>
    <section class="card">
      <h2>API access</h2>
      <p class="muted">Enter the backend API key configured by the server administrator. It is kept in this browser tab only.</p>
      <input id="apiKey" type="password" autocomplete="off" placeholder="X-API-Key">
      <button class="refresh-btn" id="saveKey">Connect</button>
      <span id="status" class="muted" role="status"></span>
    </section>
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
        <h2>Recent Bypass Activity Logs</h2>
        <button class="refresh-btn" id="refresh">Refresh Logs</button>
      </div>
      <p id="message" class="muted">Connect to load activity.</p>
      <table>
        <thead><tr><th>ID</th><th>Domain</th><th>Action</th><th>Wait Duration</th><th>Timestamp</th></tr></thead>
        <tbody id="logTableBody"></tbody>
      </table>
    </section>
  </div>
  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const body = document.getElementById('logTableBody');
    let apiKey = '';

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? 'error' : 'muted';
    }
    async function fetchLogs() {
      body.replaceChildren();
      showMessage('Loading activity…', false);
      try {
        const response = await fetch('/api/analytics?limit=100', {
          headers: apiKey ? { 'X-API-Key': apiKey } : {}
        });
        if (response.status === 401) throw new Error('Unauthorized. Enter a valid backend API key.');
        if (!response.ok) throw new Error('Could not load activity (' + response.status + ').');
        const logs = await response.json();
        if (!Array.isArray(logs) || logs.length === 0) {
          showMessage('No activity logged yet.', false);
          return;
        }
        showMessage('', false);
        for (const log of logs) {
          const row = document.createElement('tr');
          for (const value of [
            '#' + String(log.id ?? ''),
            String(log.domain ?? ''),
            String(log.action ?? ''),
            String(log.duration ?? 0) + 's',
            log.timestamp ? new Date(log.timestamp).toLocaleString() : 'Unknown'
          ]) {
            const cell = document.createElement('td');
            cell.textContent = value;
            row.append(cell);
          }
          body.append(row);
        }
      } catch (error) {
        showMessage(error.message, true);
      }
    }
    document.getElementById('saveKey').addEventListener('click', async () => {
      apiKey = apiKeyInput.value.trim();
      sessionStorage.setItem('frictionflowApiKey', apiKey);
      status.textContent = 'Key held in this tab.';
      await fetchLogs();
    });
    document.getElementById('refresh').addEventListener('click', fetchLogs);
    apiKey = sessionStorage.getItem('frictionflowApiKey') || '';
    apiKeyInput.value = apiKey;
    if (apiKey) fetchLogs();
  </script>
</body>
</html>
