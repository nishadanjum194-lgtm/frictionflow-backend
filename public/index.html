<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrictionFlow Analytics</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
    .container { max-width: 960px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem; }
    h1 { margin: 0; color: #3b82f6; font-size: 1.8rem; }
    .badge { color: #93c5fd; font-size: .85rem; }
    .card { background: #1e293b; border-radius: .75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    h2 { margin-top: 0; font-size: 1.2rem; color: #e2e8f0; }
    .connect { display: flex; gap: .6rem; flex-wrap: wrap; }
    input { flex: 1; min-width: 220px; padding: .65rem .8rem; border: 1px solid #475569; border-radius: .4rem; background: #0f172a; color: #f8fafc; }
    button { background: #3b82f6; color: white; border: 0; padding: .65rem 1rem; border-radius: .4rem; cursor: pointer; font-weight: 600; }
    button:hover { background: #2563eb; }
    #status { min-height: 1.3em; color: #94a3b8; font-size: .85rem; margin: .75rem 0 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: .75rem; text-align: left; border-bottom: 1px solid #334155; font-size: .9rem; }
    th { color: #94a3b8; font-weight: 600; }
    td { color: #cbd5e1; }
    @media (max-width: 650px) { body { padding: 1rem; } .table-wrap { overflow-x: auto; } }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>FrictionFlow Analytics</h1>
      <span class="badge" id="connectionState">Not connected</span>
    </header>

    <section class="card">
      <h2>Connect to your analytics</h2>
      <p>Enter the API_KEY configured on your FrictionFlow backend. The key is kept only in this browser tab.</p>
      <div class="connect">
        <input id="apiKey" type="password" autocomplete="off" placeholder="Backend API key">
        <button id="connect" type="button">Connect</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Recent activity</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Domain</th><th>Action</th><th>Wait</th><th>Timestamp</th></tr></thead>
          <tbody id="logTableBody"><tr><td colspan="5">Connect to load analytics.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const keyInput = document.getElementById('apiKey');
    const status = document.getElementById('status');
    const state = document.getElementById('connectionState');
    const tableBody = document.getElementById('logTableBody');
    let apiKey = sessionStorage.getItem('frictionflow_api_key') || '';
    keyInput.value = apiKey;

    function showMessage(message, connected = false) {
      status.textContent = message;
      state.textContent = connected ? 'Connected' : 'Not connected';
    }

    async function fetchLogs() {
      if (!apiKey) {
        tableBody.replaceChildren();
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 5;
        cell.textContent = 'Connect to load analytics.';
        row.appendChild(cell);
        tableBody.appendChild(row);
        return;
      }

      try {
        const response = await fetch('/api/analytics', { headers: { 'X-API-Key': apiKey } });
        if (response.status === 401 || response.status === 503) {
          showMessage('The API key was rejected or backend security is not configured.');
          return;
        }
        if (!response.ok) throw new Error('Request failed (' + response.status + ')');
        const rows = await response.json();
        tableBody.replaceChildren();
        if (!rows.length) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 5;
          cell.textContent = 'No activity logged yet.';
          row.appendChild(cell);
          tableBody.appendChild(row);
        }
        rows.forEach(log => {
          const row = document.createElement('tr');
          const values = [
            '#' + log.id,
            log.domain,
            log.action,
            log.duration + 's',
            new Date(log.timestamp).toLocaleString()
          ];
          values.forEach(value => {
            const cell = document.createElement('td');
            cell.textContent = String(value);
            row.appendChild(cell);
          });
          tableBody.appendChild(row);
        });
        showMessage('Loaded ' + rows.length + ' activity records.', true);
      } catch (error) {
        showMessage('Could not load analytics: ' + error.message);
      }
    }

    document.getElementById('connect').addEventListener('click', () => {
      apiKey = keyInput.value.trim();
      if (apiKey) sessionStorage.setItem('frictionflow_api_key', apiKey);
      else sessionStorage.removeItem('frictionflow_api_key');
      void fetchLogs();
    });
    if (apiKey) void fetchLogs();
  </script>
</body>
</html>
